<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SpaceNote 앱 아이콘: 앱 왼쪽 위 로고(토성)와 같은 형태. 재생성: npx tauri icon src-tauri/icons/source.svg -->
  <defs>
    <radialGradient id="sky" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#1b2d5c"/>
      <stop offset="1" stop-color="#070d1f"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset="0.55" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b07d2b"/>
    </radialGradient>
    <clipPath id="ball"><circle r="230"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#sky)"/>

  <!-- 별 -->
  <g fill="#ffffff">
    <circle cx="190" cy="210" r="10" opacity="0.9"/>
    <circle cx="870" cy="760" r="9" opacity="0.8"/>
    <circle cx="160" cy="800" r="6" opacity="0.6"/>
    <circle cx="300" cy="120" r="5" opacity="0.5"/>
    <circle cx="700" cy="880" r="5" opacity="0.5"/>
    <path d="M800 150 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z" opacity="0.9"/>
  </g>

  <g transform="translate(512 512) rotate(-22)">
    <!-- 고리 뒤쪽 반 -->
    <path d="M -420 0 A 420 128 0 0 1 420 0" fill="none" stroke="#f3dc9a" stroke-width="44" stroke-linecap="round" opacity="0.55"/>
    <!-- 행성 -->
    <circle r="230" fill="url(#planet)"/>
    <g clip-path="url(#ball)" fill="none" stroke="#a8742a" stroke-opacity="0.35" stroke-width="22">
      <path d="M -260 -80 Q 0 -110 260 -80"/>
      <path d="M -260 70 Q 0 40 260 70"/>
    </g>
    <!-- 고리 앞쪽 반 -->
    <path d="M -420 0 A 420 128 0 0 0 420 0" fill="none" stroke="#fbe7a6" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
