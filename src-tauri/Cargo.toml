[package]
name = "space-note"
version = "0.1.0"
description = "SpaceNote — AI-powered note app"
authors = []
edition = "2021"

[lib]
name = "space_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
